name: Build fileshare (ImmortalWrt 24.10, mt7981)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/3rd-eyes/immortalwrt-mt798x-6.6
  REPO_BRANCH: 2410
  FEED_NAME: fileshare

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout fileshare-openwrt
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clone source
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
      - name: Add fileshare feed
        run: |
          cd openwrt
          echo "src-link ${FEED_NAME} $GITHUB_WORKSPACE" >> feeds.conf.default
          ./scripts/feeds update ${FEED_NAME}
          ./scripts/feeds install -a -p ${FEED_NAME}

      - name: Update & install all feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_generic=y

          CONFIG_PACKAGE_fileshare=m
          CONFIG_PACKAGE_luci-app-fileshare=m

          CONFIG_PACKAGE_node=y
          CONFIG_PACKAGE_node-npm=y
          EOF

          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build fileshare packages
        run: |
          cd openwrt
          make package/fileshare/compile -j$(nproc) V=s
          make package/luci-app-fileshare/compile -j$(nproc) V=s

      - name: Upload ipk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fileshare-ipk-mt7981
          path: |
            openwrt/bin/packages/**/fileshare_*.ipk
            openwrt/bin/packages/**/luci-app-fileshare_*.ipk